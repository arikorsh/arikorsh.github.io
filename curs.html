<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="rgz.css">
    <link rel="shortcut icon" href="rgz_icom.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        .menu {
            font-size: 24px;
            margin: 0px;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.127);
        }
        .menu-point {
            margin-left: 15px;
            margin-right: 15px;
            font-size: 24px;
        }
        .nav-tabs .nav-link.active {
            color: #169A35;
        }
        .nav-link {
            color: black;
        }
        .bar {
            background-color: #169A35;
            width: 25px;
            border-radius: 5px 5px 0 0;
            transition: all 0.2s;
            cursor: pointer;
        }
        .bar:hover {
            background-color: #0d6efd;
            opacity: 0.8;
        }
        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }
        .bar-label {
            font-size: 14px;
            text-align: center;
            margin-top: 5px;
            transform: rotate(-45deg);
            white-space: nowrap;
        }
        .chart-container {
            overflow-x: auto;
            padding: 10px 0;
        }
        .info-box {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
        }
        .currency-card {
            background-color: #f0f8f0;
            padding: 8px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #169A35;
        }
    </style>
</head>
<body>
    <header>
        НГТУ, ФБ, Расчетно-графическое задание
    </header>

    <main>
        <div class="menu">
            <h3>Меню</h3>
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" href="about.html">О компании</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="news.html">Новости</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="curs.html">Курс валют</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Контактные данные</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="video.html">Видео</a>
                </li>
            </ul>
        </div>
        <hr>
        
        <h3>Курс валют</h3>
        
        <div class="currency-card">
            <strong>🇵🇱 Польский злотый (PLN)</strong><br>
            <span id="pln-rate">Загрузка курса...</span>
        </div>
        
        <div class="row" style="margin-left: 1px;">
            <div class="col-md-6">
                <label>Сумма в рублях (RUB): </label>
                <input type="number" id="rub-input" value="1000" class="form-control" step="any">
            </div>
            <div class="col-md-6">
                <label>Сумма в злотых (PLN): </label>
                <input type="number" id="currency-input" value="0" class="form-control" step="any">
            </div>
        </div>

        <hr>
        <h4 style="margin-left: 5px;">Динамика курса PLN за последний месяц</h4>
        <div class="chart-container">
            <div id="bars" style="display: flex; gap: 5px; align-items: flex-end; min-height: 300px;"></div>
        </div>
        <div id="info" class="info-box"></div>
    </main>

    <footer>
        &copy; Арина Коршкова ФБИ-42, 2 курс, 2026
    </footer>
    <script src="curs.js"></script>
    <script>
        let currentRate = null;

        function loadTodayRate() {
            fetch('https://www.cbr-xml-daily.ru/daily_json.js')
                .then(response => response.json())
                .then(data => {
                    currentRate = data.Valute.PLN.Value;
                    document.getElementById('pln-rate').innerHTML = `1 PLN = ${currentRate.toFixed(4)} RUB`;
                    updateFromRub();
                });
        }

        function drawChart() {
            let container = document.getElementById('bars');
            container.innerHTML = '';
            
            let rates = historicalRates.map(item => item.rate);
            let maxRate = Math.max(...rates);
            let minRate = Math.min(...rates);

            let minHeight = 60;  
            let maxHeight = 200;
            
            for (let i = 0; i < historicalRates.length; i++) {
                let item = historicalRates[i];
                
                let height = minHeight + ((item.rate - minRate) / (maxRate - minRate)) * (maxHeight - minHeight);
                
                let wrapper = document.createElement('div');
                wrapper.style.cssText = 'display: flex; flex-direction: column; align-items: center; width: 38px; margin: 0 2px;';
                
                let bar = document.createElement('div');
                bar.style.cssText = `height: ${height}px; width: 26px; background-color: #169A35; border-radius: 6px 6px 0 0; cursor: pointer;`;
                bar.onmouseover = () => bar.style.backgroundColor = '#0d6efd';
                bar.onmouseout = () => bar.style.backgroundColor = '#169A35';
                bar.onclick = (function(date, rate) {
                    return function() {
                        document.getElementById('info').innerHTML = `<strong>${date}</strong><br>Курс: ${rate.toFixed(4)} RUB`;
                    };
                })(item.date, item.rate);
                
                let label = document.createElement('div');
                label.style.cssText = 'font-size: 8px; margin-top: 6px; text-align: center; white-space: nowrap; transform: rotate(-30deg);';
                label.innerText = item.date.slice(0, 5);
                
                wrapper.appendChild(bar);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
            }
        }

        function updateFromRub() {
            if (!currentRate) return;
            let rub = parseFloat(document.getElementById('rub-input').value) || 0;
            document.getElementById('currency-input').value = (rub / currentRate).toFixed(2);
        }

        function updateFromPln() {
            if (!currentRate) return;
            let pln = parseFloat(document.getElementById('currency-input').value) || 0;
            document.getElementById('rub-input').value = (pln * currentRate).toFixed(2);
        }

        document.getElementById('rub-input').oninput = updateFromRub;
        document.getElementById('currency-input').oninput = updateFromPln;

        loadTodayRate();
        drawChart();
    </script>
</body>
</html>
